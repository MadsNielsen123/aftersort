name: CI

# Master is covered by the Release workflow, which builds the same code; this
# guards pull requests before they land.
on:
  pull_request:
    branches: [master]

jobs:
  build:
    # Ubuntu on purpose: its case-sensitive filesystem catches avares:// path
    # casing mismatches that a Windows-only build would silently tolerate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build AfterSort.sln -c Release
