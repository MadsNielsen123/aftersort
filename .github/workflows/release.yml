name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# A newer master push makes an in-flight rolling build obsolete; tags each get
# their own group so a real release build is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  publish:
    # Every RID cross-publishes fine from one Linux runner, and Linux is the only
    # host that sets the executable bit on the macOS/Linux apphosts.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-master.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Not single-file: LibVLC loads its plugins/ directory from disk next to the
      # apphost, which a self-extracting bundle breaks.
      - name: Publish
        run: |
          dotnet publish AfterSort/AfterSort.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.v.outputs.version }} \
            -o publish/${{ matrix.rid }}

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          ver="${{ steps.v.outputs.version }}"
          mkdir -p dist

          if [[ "$rid" == osx-* ]]; then
            app="stage/AfterSort.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp -R "publish/$rid/." "$app/Contents/MacOS/"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>AfterSort</string>
            <key>CFBundleDisplayName</key><string>AfterSort</string>
            <key>CFBundleIdentifier</key><string>com.madsnielsen.aftersort</string>
            <key>CFBundleVersion</key><string>$ver</string>
            <key>CFBundleShortVersionString</key><string>$ver</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>AfterSort</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
            name="aftersort-$ver-$rid.zip"
            (cd stage && zip -qr "../dist/$name" AfterSort.app)
          elif [[ "$rid" == win-* ]]; then
            name="aftersort-$ver-$rid.zip"
            (cd "publish/$rid" && zip -qr "../../dist/$name" .)
          else
            name="aftersort-$ver-$rid.tar.gz"
            tar -czf "dist/$name" -C "publish/$rid" .
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: dist/${{ steps.pkg.outputs.name }}

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The tag may have been created by "Draft a new release" in the web UI,
          # in which case the release already exists and just needs its binaries.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi

      # Rolling build of master. Deleted and recreated rather than updated so the
      # `latest` tag follows master instead of pinning to its first build.
      - name: Publish rolling release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build (master)" \
            --prerelease \
            --notes "Automatic build of the latest master commit, refreshed on every push.

          Commit: $GITHUB_SHA

          For a fixed, stable version use one of the tagged releases instead."
